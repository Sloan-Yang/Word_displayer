[package]
name = "word_displayer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.31"
rayon = "1"
walkdir = "2"
# 只用来解码那张背景图
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# 只为了注册 Ctrl+9 这个全局热键
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 操作 NSWindow / NSScreen：窗口显隐、顶端居中、多屏定位、救回尺寸。
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSEnumerator",
    "NSGeometry",
    "NSString",
    "NSThread",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
# 全局热键 Cmd+9 走 Carbon 的 RegisterEventHotKey（无需辅助功能权限），
# 通过 #[link] 直接链接 Carbon framework，不再单列依赖。
# localtime_r：按系统时区取本地小时，给日/夜主题自动切换用。
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
